name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.release }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper meson ninja-build pkgconf git ca-certificates \
            libglib2.0-dev libssl-dev libopencv-dev libfprint-2-tod-dev

      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist
          for deb in ../*.deb; do
            cp "$deb" "dist/$(basename "$deb" _amd64.deb)_ubuntu${{ matrix.release }}_amd64.deb"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lg-gram-fingerprint-ubuntu${{ matrix.release }}
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
